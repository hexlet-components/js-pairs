version: 2
updates:
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore"
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore"
    groups:
      github-actions-all:
        patterns: ["*"]
