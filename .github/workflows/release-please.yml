name: Release Please

# Ведёт версию и CHANGELOG.md по conventional commits и ставит тег v*.
# Публикацию в npm делает не этот workflow, а release.yml, который срабатывает
# на пуш тега. То есть здесь закрывается только версионирование: ровно тот шаг,
# который раньше делали руками и из-за которого версии в git и в npm разошлись.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
        env:
          # Без этого release-please 17 падает с «self-signed certificate».
          # Он ходит в API через undici, который берёт свой набор корневых
          # сертификатов вместо системного.
          NODE_OPTIONS: --use-system-ca

      # «Автоматический релиз при зелёных проверках»: PR вливается сам, но
      # только после обязательных статус-проверок. Требование зелёного CI даёт
      # защита ветки, а не этот шаг. Если защиту снять, PR вольётся немедленно
      # и проверки перестанут что-либо значить.
      #
      # JSON от release-please разбирается в шаге, а не в env через fromJSON:
      # выражения в env вычисляются до проверки `if`, и на пустом выводе
      # (релизить нечего или предыдущий шаг упал) весь workflow падает с
      # «Error reading JToken from JsonReader».
      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.pr }}
        run: |
          number=$(printf '%s' "$RELEASE_PR" | jq -r .number)
          gh pr merge --auto --squash "$number"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
