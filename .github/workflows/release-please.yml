name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: jdx/mise-action@v5
        if: ${{ steps.release.outputs.release_created }}

      # setup-node здесь только ради registry-url: node и pnpm ставит mise-action.
      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          registry-url: 'https://registry.npmjs.org'

      - run: make install
        if: ${{ steps.release.outputs.release_created }}

      - run: make lint
        if: ${{ steps.release.outputs.release_created }}

      - run: make test
        if: ${{ steps.release.outputs.release_created }}

      - run: make publish
        if: ${{ steps.release.outputs.release_created }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_COM }}
