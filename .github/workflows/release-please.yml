name: Release Please

# Ведёт версию и CHANGELOG.md по conventional commits и ставит тег v*.
# Публикацию в npm делает не этот workflow, а release.yml, который срабатывает
# на пуш тега. То есть здесь закрывается только версионирование: ровно тот шаг,
# который раньше делали руками и из-за которого версии в git и в npm разошлись.
#
# Релизный PR вливается руками. Автомержа здесь намеренно нет: PR создаёт
# GITHUB_TOKEN, а GitHub не запускает workflow от его событий (защита от
# рекурсии). Поэтому обязательные проверки на релизном PR либо не стартуют
# вовсе, либо встают в action_required, и автомерж ждал бы статуса, которого
# никто не пришлёт.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
        env:
          # Без этого release-please 17 падает с «self-signed certificate».
          # Он ходит в API через undici, который берёт свой набор корневых
          # сертификатов вместо системного.
          NODE_OPTIONS: --use-system-ca
