name: Release Please

# Ведёт версию и CHANGELOG.md по conventional commits и ставит тег v*.
# Публикацию в npm делает не этот workflow, а release.yml, который срабатывает
# на пуш тега. То есть здесь закрывается только версионирование: ровно тот шаг,
# который раньше делали руками и из-за которого версии в git и в npm разошлись.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

      # «Автоматический релиз при зелёных проверках»: PR вливается сам, но
      # только после обязательных статус-проверок. Требование зелёного CI даёт
      # защита ветки, а не этот шаг. Если защиту снять, PR вольётся немедленно
      # и проверки перестанут что-либо значить.
      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.pr }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
