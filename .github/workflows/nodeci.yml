name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7

      # pnpm ставится до setup-node: setup-node с cache: pnpm ищет уже
      # существующий бинарь, чтобы вычислить путь к store. В обратном порядке
      # шаг падает с «Unable to locate executable file: pnpm».
      - uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version}}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version}}
          cache: pnpm

      - name: Install
        run: make install
      - name: Run linter
        run: make lint
      - name: Run tests
        run: make test
