name: Node CI

# Только на пулреквестах. На main проверки идут внутри Release Please, чтобы
# мерж давал ровно один прогон, а не два workflow на один и тот же коммит.
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install
        run: make install
      - name: Run linter
        run: make lint
      - name: Run tests
        run: make test
